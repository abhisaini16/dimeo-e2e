name: Cooma Random Check-in/out

on:
  # Schedule moved to Google Cloud Scheduler (see cloud/jobs.js); manual runs only here.
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Force an action now, bypassing the time check (for testing)'
        type: choice
        options: [auto, checkin, checkout]
        default: auto

permissions:
  contents: read
  issues: write  # lets the run post its result as a GitHub Issue comment

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine which trigger fired
        id: which
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "47 18 * * *" ] || [ "$SCHEDULE" = "47 19 * * *" ]; then
            echo "trigger=checkin" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=checkout" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to proceed this tick
        id: decide
        run: node scripts/cooma-decide.js
        env:
          FORCE_ACTION: ${{ github.event.inputs.force_action || 'auto' }}
          WHICH_TRIGGER: ${{ steps.which.outputs.trigger || 'checkin' }}

      # Runs every day of the week — a day with no actual shift is handled by the
      # live portal check reporting "no-active-shift", not by a weekday guess here.
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.should_act == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.decide.outputs.should_act == 'true'
        run: npm install

      - name: Install Playwright browser
        if: steps.decide.outputs.should_act == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore site/account credentials from secret
        if: steps.decide.outputs.should_act == 'true'
        run: echo "$CHECKIN_SITES_JSON" > tests/data/checkin-sites.json
        env:
          CHECKIN_SITES_JSON: ${{ secrets.CHECKIN_SITES_JSON }}

      - name: Run check-in
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkin'
        run: node scripts/run-cooma-checkin.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Run check-out
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkout'
        run: node scripts/run-cooma-checkout.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
