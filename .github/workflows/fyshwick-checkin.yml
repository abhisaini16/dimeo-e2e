name: Fyshwick Random Check-in/out

on:
  schedule:
    # Fyshwick's window depends on the day: an early-morning window on weekdays, a
    # very different afternoon window on Saturdays, and no shift at all on Sundays.
    # Each day-type needs its own check-in/check-out cron pair (x2 for the two DST
    # states) — 8 invocations/day total, same single-sleep-per-hit design as
    # yass-checkin.yml/cooma-checkin.yml. Whichever pair doesn't match today's actual
    # Sydney day-of-week is rejected cheaply in fyshwick-decide.js.
    - cron: '18 19 * * *'  # ~6:18am AEDT -> weekday check-in trigger
    - cron: '18 20 * * *'  # ~6:18am AEST -> weekday check-in trigger
    - cron: '33 21 * * *'  # ~8:33am AEDT -> weekday check-out trigger (sleeps the rest of the way)
    - cron: '33 22 * * *'  # ~8:33am AEST -> weekday check-out trigger
    - cron: '14 3 * * *'   # ~2:14pm AEDT -> Saturday check-in trigger
    - cron: '14 4 * * *'   # ~2:14pm AEST -> Saturday check-in trigger
    - cron: '29 5 * * *'   # ~4:29pm AEDT -> Saturday check-out trigger (sleeps the rest of the way)
    - cron: '29 6 * * *'   # ~4:29pm AEST -> Saturday check-out trigger
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Force an action now, bypassing the time/day check (for testing)'
        type: choice
        options: [auto, checkin, checkout]
        default: auto

permissions:
  contents: read
  issues: write  # lets the run post its result as a GitHub Issue comment

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine which trigger fired
        id: which
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "18 19 * * *"|"18 20 * * *")
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
            "33 21 * * *"|"33 22 * * *")
              echo "trigger=checkout" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
            "14 3 * * *"|"14 4 * * *")
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            "29 5 * * *"|"29 6 * * *")
              echo "trigger=checkout" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Decide whether to proceed this tick
        id: decide
        run: node scripts/fyshwick-decide.js
        env:
          FORCE_ACTION: ${{ github.event.inputs.force_action || 'auto' }}
          WHICH_TRIGGER: ${{ steps.which.outputs.trigger }}
          TARGET_DAY_TYPE: ${{ steps.which.outputs.day_type }}

      # Runs only on the ~2 ticks/day that actually match today's real day-type and
      # reference time — every other tick (the vast majority) stops above.
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.should_act == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.decide.outputs.should_act == 'true'
        run: npm install

      - name: Install Playwright browser
        if: steps.decide.outputs.should_act == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore site/account credentials from secret
        if: steps.decide.outputs.should_act == 'true'
        run: echo "$CHECKIN_SITES_JSON" > tests/data/checkin-sites.json
        env:
          CHECKIN_SITES_JSON: ${{ secrets.CHECKIN_SITES_JSON }}

      - name: Run check-in
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkin'
        run: node scripts/run-fyshwick-checkin.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Run check-out
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkout'
        run: node scripts/run-fyshwick-checkout.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
