name: Queenbeyan Random Check-in/out

on:
  schedule:
    # Queenbeyan's window depends on the day: an evening window on weekdays, a
    # different afternoon window on Saturdays, no shift on Sundays. Each day-type
    # needs its own check-in/check-out cron pair (x2 for the two DST states) — 8
    # invocations/day total, same single-sleep-per-hit design as
    # yass-checkin.yml/fyshwick-checkin.yml. Whichever pair doesn't match today's
    # actual Sydney day-of-week is rejected cheaply in queenbeyan-decide.js.
    - cron: '0 7 * * *'    # ~6:00pm AEDT -> weekday check-in trigger
    - cron: '0 8 * * *'    # ~6:00pm AEST -> weekday check-in trigger
    - cron: '40 8 * * *'   # ~7:40pm AEDT -> weekday check-out trigger (sleeps the rest of the way)
    - cron: '40 9 * * *'   # ~7:40pm AEST -> weekday check-out trigger
    - cron: '0 3 * * *'    # ~2:00pm AEDT -> Saturday check-in trigger
    - cron: '0 4 * * *'    # ~2:00pm AEST -> Saturday check-in trigger
    - cron: '40 4 * * *'   # ~3:40pm AEDT -> Saturday check-out trigger (sleeps the rest of the way)
    - cron: '40 5 * * *'   # ~3:40pm AEST -> Saturday check-out trigger
    - cron: '05 12 * * *'  # TEMPORARY live scheduler test: check-in trigger — remove after confirming
    - cron: '15 12 * * *'  # TEMPORARY live scheduler test: check-out trigger — remove after confirming
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Force an action now, bypassing the time/day check (for testing)'
        type: choice
        options: [auto, checkin, checkout]
        default: auto

permissions:
  contents: read
  issues: write  # lets the run post its result as a GitHub Issue comment

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine which trigger fired
        id: which
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "0 7 * * *"|"0 8 * * *")
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
            "40 8 * * *"|"40 9 * * *")
              echo "trigger=checkout" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
            "0 3 * * *"|"0 4 * * *")
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            "40 4 * * *"|"40 5 * * *")
              echo "trigger=checkout" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            "05 12 * * *")
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            "15 12 * * *")
              echo "trigger=checkout" >> "$GITHUB_OUTPUT"
              echo "day_type=saturday" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "trigger=checkin" >> "$GITHUB_OUTPUT"
              echo "day_type=weekday" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Decide whether to proceed this tick
        id: decide
        run: node scripts/queenbeyan-decide.js
        env:
          FORCE_ACTION: ${{ github.event.inputs.force_action || 'auto' }}
          WHICH_TRIGGER: ${{ steps.which.outputs.trigger }}
          TARGET_DAY_TYPE: ${{ steps.which.outputs.day_type }}

      # Runs only on the ~2 ticks/day that actually match today's real day-type and
      # reference time — every other tick (the vast majority) stops above.
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.should_act == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.decide.outputs.should_act == 'true'
        run: npm install

      - name: Install Playwright browser
        if: steps.decide.outputs.should_act == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore site/account credentials from secret
        if: steps.decide.outputs.should_act == 'true'
        run: echo "$CHECKIN_SITES_JSON" > tests/data/checkin-sites.json
        env:
          CHECKIN_SITES_JSON: ${{ secrets.CHECKIN_SITES_JSON }}

      - name: Run check-in
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkin'
        run: node scripts/run-queenbeyan-checkin.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Run check-out
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.action == 'checkout'
        run: node scripts/run-queenbeyan-checkout.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
