name: Yass Random Check-in/out

on:
  schedule:
    # Exactly 2 logical events/day (check-in, check-out), each needing a pair of cron
    # entries for the two DST states — 4 invocations/day total. Each real hit sleeps
    # internally to land its action at today's precise deterministic target (see
    # lib/yass-schedule.js); the "wrong DST" entry of each pair just does a cheap
    # sanity-check-and-skip. This is deliberately NOT frequent polling: GitHub Actions
    # bills each invocation at a minimum of 1 full minute regardless of duration, so
    # many short polls cost more in total than a few longer, purposeful ones.
    - cron: '0 18 * * *'  # ~5:00am AEDT -> check-in trigger
    - cron: '0 19 * * *'  # ~5:00am AEST -> check-in trigger
    - cron: '5 19 * * *'  # ~6:05am AEDT -> check-out trigger (sleeps the rest of the way)
    - cron: '5 20 * * *'  # ~6:05am AEST -> check-out trigger
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Force an action now, bypassing the time check (for testing)'
        type: choice
        options: [auto, checkin, checkout]
        default: auto
      force_weekday:
        description: 'Override the weekday check (for testing Sat/Sun behavior on a weekday or vice versa)'
        type: choice
        options: [real, weekday, weekend]
        default: real

permissions:
  contents: read
  issues: write  # lets the run post its result as a GitHub Issue comment

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine which trigger fired
        id: which
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "0 18 * * *" ] || [ "$SCHEDULE" = "0 19 * * *" ]; then
            echo "trigger=checkin" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=checkout" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to proceed this tick
        id: decide
        run: node scripts/yass-decide.js
        env:
          FORCE_ACTION: ${{ github.event.inputs.force_action || 'auto' }}
          FORCE_WEEKDAY: ${{ github.event.inputs.force_weekday || 'real' }}
          WHICH_TRIGGER: ${{ steps.which.outputs.trigger || 'checkin' }}

      # Weekend hit: report "no shift" directly, no portal/Playwright needed at all.
      - name: Report no shift (weekend)
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'false'
        run: node scripts/yass-report-no-shift.js
        env:
          YASS_ACTION: ${{ steps.decide.outputs.action }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Weekday hit: do the real thing. These steps only run on the ~2 ticks/day
      # that actually match — every other tick (the vast majority) stops above.
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true'
        run: npm install

      - name: Install Playwright browser
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore site/account credentials from secret
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true'
        run: echo "$CHECKIN_SITES_JSON" > tests/data/checkin-sites.json
        env:
          CHECKIN_SITES_JSON: ${{ secrets.CHECKIN_SITES_JSON }}

      - name: Run check-in
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true' && steps.decide.outputs.action == 'checkin'
        run: node scripts/run-yass-checkin.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Run check-out
        if: steps.decide.outputs.should_act == 'true' && steps.decide.outputs.is_weekday == 'true' && steps.decide.outputs.action == 'checkout'
        run: node scripts/run-yass-checkout.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
